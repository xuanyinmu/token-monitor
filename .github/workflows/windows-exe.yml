name: Windows exe

# Unsigned Windows packages for this fork (and other non-upstream clones).
# Official signed installers stay on the tagged Release workflow.
# This workflow must not run as a pull_request check on Javis603/token-monitor.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'

concurrency:
  group: windows-exe-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dist-win:
    if: github.repository != 'Javis603/token-monitor'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Windows installer and portable exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Verify updater artifact names
        run: npm run verify:release-artifact-names
      - uses: actions/upload-artifact@v4
        with:
          name: token-monitor-win
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
