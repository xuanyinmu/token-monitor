name: Qt build (Windows)

# Unsigned Qt/native Windows build for this fork (and other non-upstream
# clones), mirroring the windows-exe.yml fork guard.
#
# The job no longer uploads a loose dump of qt/build. That dump was not usable
# on a clean machine: it had no sqldrivers/qsqlite.dll (Cursor's state.vscdb
# fallback and Qoder CN usage silently returned nothing), no MSVC runtime
# (windeployqt drops vc_redist.x64.exe instead of the CRT DLLs, and the old
# upload glob skipped it), and no tokscale.exe (the widget has no self-download
# path, so usage collection reported tokscale_missing forever).
#
# qt/scripts/package.ps1 now builds both deliverables from one staged
# deployment and smoke-tests them with PATH stripped to System32, so passing
# this job means the artifacts run by themselves:
#   * Token-Monitor-Qt-Setup-<version>.exe   NSIS installer, per-user, with a
#     zero-residue uninstaller
#   * Token-Monitor-Qt-<version>-win-x64-portable.zip   extract and run
# -VerifyInstall additionally installs, smoke-tests, uninstalls and asserts
# that nothing is left behind (and restores the pre-test state).

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'

concurrency:
  group: qt-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qt-windows:
    if: github.repository != 'Javis603/token-monitor'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8.3 (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # windows-latest may be windows-2025, which does not preinstall NSIS, and
      # package.ps1 locates makensis by path rather than by PATH so the choco
      # shim does not have to be visible here.
      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Configure
        run: cmake -S qt -B qt/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build qt/build

      - name: Checks
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./qt/scripts/checks.ps1

      - name: Package (installer, portable zip, smoke test, install/uninstall verification)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./qt/scripts/package.ps1 -SkipBuild -SkipChecks -VerifyInstall

      - name: Upload Qt installer
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-qt-installer
          if-no-files-found: error
          retention-days: 30
          path: qt/out/Token-Monitor-Qt-Setup-*.exe

      - name: Upload Qt portable zip
        uses: actions/upload-artifact@v4
        with:
          name: token-monitor-qt-portable
          if-no-files-found: error
          retention-days: 30
          path: qt/out/Token-Monitor-Qt-*-portable.zip

      - name: Upload checks log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-checks
          if-no-files-found: ignore
          retention-days: 7
          path: qt/build/*.log
